<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Reynolds Dryline image coming soon">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111111"/>
      <stop offset="55%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#2a2a2a"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="800" fill="url(#bg)"/>
  <rect width="1200" height="800" fill="url(#grid)"/>
  <rect x="0" y="0" width="8" height="800" fill="#e23125"/>
  <rect x="0" y="792" width="1200" height="8" fill="#e23125"/>

  <!-- Camera glyph -->
  <g transform="translate(600 320)" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
    <rect x="-54" y="-28" width="108" height="78" rx="10"/>
    <path d="M-28 -28l12 -18h32l12 18"/>
    <circle cx="0" cy="14" r="22"/>
    <circle cx="0" cy="14" r="10" fill="#e23125" stroke="none"/>
  </g>

  <text x="600" y="460" text-anchor="middle" fill="#ffffff" font-family="Montserrat, Arial, sans-serif" font-size="42" font-weight="800" letter-spacing="4">
    IMAGE COMING SOON
  </text>
  <text x="600" y="510" text-anchor="middle" fill="rgba(255,255,255,0.62)" font-family="Montserrat, Arial, sans-serif" font-size="20" font-weight="600" letter-spacing="3">
    REYNOLDS DRYLINE
  </text>
</svg>
